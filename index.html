<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FORPIN - Scuola di Formazione di Confindustria Piacenza</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
    }

    body {
      color: #333;
      background-color: #ffffff;
    }

    /* Header e Navigazione FORPIN */
    .header-container {
      background-color: #0b2265;
      color: #ffffff;
      width: 100%;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .top-bar {
      max-width: 1200px;
      margin: 0 auto;
      padding: 12px 20px 8px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Logo FORPIN */
    .logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: white;
    }

    .logo-sphere {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ffffff 15%, #5a8bd8 45%, #0b2265 85%);
    }

    .logo-text {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .top-menu {
      display: flex;
      align-items: center;
      gap: 20px;
      font-size: 13px;
    }

    .top-menu a {
      color: #ffffff;
      text-decoration: none;
      transition: opacity 0.2s;
    }

    .top-menu a:hover {
      opacity: 0.8;
    }

    .top-icons {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-left: 10px;
    }

    .main-nav {
      max-width: 1200px;
      margin: 0 auto;
      padding: 8px 20px 14px 20px;
      display: flex;
      justify-content: center;
      gap: 30px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .main-nav a {
      color: #ffffff;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* Sezione Hero principale */
    .hero {
      position: relative;
      background: #0b2265;
      color: white;
      min-height: 520px;
      display: flex;
      align-items: center;
      overflow: hidden;
    }

    .hero-bg {
      position: absolute;
      top: 0;
      right: 0;
      width: 65%;
      height: 100%;
      background-image: url('https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=1350&q=80');
      background-size: cover;
      background-position: center;
    }

    .hero-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #0b2265 0%, #0b2265 45%, rgba(11, 34, 101, 0.75) 65%, rgba(11, 34, 101, 0.1) 100%);
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .hero-text-block {
      max-width: 520px;
    }

    .hero h1 {
      font-size: 38px;
      font-weight: 700;
      line-height: 1.25;
      margin-bottom: 20px;
    }

    .hero p {
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 25px;
      font-weight: 500;
      opacity: 0.95;
    }

    .btn-primary {
      display: inline-block;
      background-color: #1a3989;
      color: white;
      padding: 12px 28px;
      border-radius: 4px;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      transition: background-color 0.2s;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .btn-primary:hover {
      background-color: #2349ac;
    }

    @media (max-width: 768px) {
      .top-menu, .main-nav {
        display: none;
      }
      .hero-bg {
        width: 100%;
        opacity: 0.3;
      }
      .hero-overlay {
        background: #0b2265;
        opacity: 0.85;
      }
      .hero h1 {
        font-size: 28px;
      }
    }
  </style>
</head>
<body>

  <header class="header-container">
    <div class="top-bar">
      <a href="#" class="logo-container">
        <div class="logo-sphere"></div>
        <span class="logo-text">FORPIN</span>
      </a>

      <div class="top-menu">
        <a href="#">Chi siamo</a>
        <a href="#">Podcast Forpin for AI</a>
        <a href="#">News</a>
        <a href="#">Contatti</a>
        <div class="top-icons">
          <a href="#"><i class="far fa-newspaper"></i></a>
          <a href="#"><i class="fas fa-search"></i></a>
        </div>
      </div>
    </div>

    <nav class="main-nav">
      <a href="#">CATALOGO CORSI <i class="fas fa-chevron-down" style="font-size: 10px;"></i></a>
      <a href="#">PER LE AZIENDE <i class="fas fa-chevron-down" style="font-size: 10px;"></i></a>
      <a href="#">PER LE PERSONE <i class="fas fa-chevron-down" style="font-size: 10px;"></i></a>
    </nav>
  </header>

  <section class="hero">
    <div class="hero-bg"></div>
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <div class="hero-text-block">
        <h1>Formiamo con cura il futuro del nostro territorio</h1>
        <p>Da 35 anni, Scuola di Formazione<br>di Confindustria Piacenza.</p>
        <a href="#" class="btn-primary">Scopri di più!</a>
      </div>
    </div>
  </section>

</body>
</html>
